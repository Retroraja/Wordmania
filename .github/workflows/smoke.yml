name: Emulator smoke test

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          # The Gradle download sometimes times out: try 3 times.
          for i in 1 2 3; do ./gradlew :app:assembleDebug --no-daemon && break; sleep 40; done
          cp app/build/outputs/apk/debug/app-debug.apk Wordnoid.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_5
          disable-animations: false
          script: ./tools/smoke/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-out
          path: smoke-out
