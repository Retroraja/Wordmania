name: YouTube gameplay recording

on:
  push:
    paths: ['tools/video/record.sh', '.github/workflows/video.yml']
    branches: ['claude/project-thread-v4zvgc']

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          for i in 1 2 3; do ./gradlew :app:assembleDebug --no-daemon && break; sleep 40; done
          cp app/build/outputs/apk/debug/app-debug.apk Wordnoid.apk
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 720x1280
          script: ./tools/video/record.sh
      - name: Compress and save to the branch
        if: always()
        run: |
          cd video-out
          for f in rec-*.mp4; do [ -f "$f" ] && ffmpeg -y -loglevel error -i "$f" -c:v libx264 -crf 17 -preset veryfast -pix_fmt yuv420p "c-$f" && mv "c-$f" "$f"; done
          for f in *.mp4; do ffprobe -v error -show_entries stream=width,height,r_frame_rate,avg_frame_rate,nb_frames:format=duration -of compact "$f"; done
          ls -la
          cd ..
          rm -f video-out/logcat.txt video-out/ui.xml video-out/words.txt video-out/prefs.xml
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p recordings && rm -rf recordings/latest && mv video-out recordings/latest
          git add recordings/latest && git commit -m "Gameplay recording [skip ci]" && git push origin HEAD:${GITHUB_REF_NAME}
