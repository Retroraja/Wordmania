name: Crash hunt

on:
  workflow_dispatch:
  push:
    branches: ['claude/project-thread-y8763m']

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 26, target: google_apis, profile: pixel_2 }
          - { api: 29, target: default, profile: pixel_3a }
          - { api: 33, target: google_apis, profile: pixel_6 }
          - { api: 34, target: google_apis, profile: pixel_tablet }
          - { api: 35, target: google_apis, profile: pixel_8 }
          - { api: 36, target: google_apis, profile: pixel_9 }
          - { api: 36, target: google_apis, profile: pixel_tablet }
          - { api: 36, target: google_apis_playstore, profile: pixel_9 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        env:
          ADMOB_PUB_ID: ${{ secrets.ADMOB_PUB_ID }}
        run: |
          for i in 1 2 3; do ./gradlew :app:assembleRelease --no-daemon && break; sleep 40; done
          cp app/build/outputs/apk/release/app-release.apk Wordnoid-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: ./tools/crash/hunt.sh
