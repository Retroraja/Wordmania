<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
@font-face{font-family:"Lilita One";src:url(LilitaOne.ttf)}
@font-face{font-family:"Press Start 2P";src:url(PressStart2P.ttf)}
:root{--gold:#ffc93c;--display:"Lilita One","Arial Black",sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{position:fixed;inset:0;pointer-events:none}
.bg-intro{background:radial-gradient(circle at 50% 42%,#3566e8 0%,#18287a 45%,#070c2c 100%)}
.intro-name{position:absolute;left:0;right:0;bottom:9%;text-align:center;font-family:var(--display);font-size:clamp(22px,7vh,46px);letter-spacing:.32em;color:#fff;
  text-shadow:0 0 18px rgba(120,170,255,.9),0 3px 0 #0b1a66;opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s,letter-spacing 1.4s}
.intro-name.show{opacity:1;transform:none;letter-spacing:.12em}
.intro-sub{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-family:var(--display);font-size:clamp(20px,6vh,40px);color:var(--gold);
  text-shadow:0 3px 0 #7a3b00,0 0 20px rgba(255,200,60,.6);opacity:0;transform:scale(.6);transition:opacity .5s,transform .5s cubic-bezier(.3,1.6,.5,1)}
.intro-sub.show{opacity:1;transform:none}
.big-msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--display);font-size:clamp(34px,13vh,96px);color:var(--gold);
  text-shadow:0 5px 0 #8a3b00,0 0 30px rgba(255,220,100,.7);opacity:0;transform:scale(.3);transition:transform .45s cubic-bezier(.3,1.7,.5,1),opacity .3s}
.big-msg.show{opacity:1;transform:scale(1)}
.big-msg.out{opacity:0;transform:scale(1.4) translateY(-40%);transition:all .5s ease-in}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ov">
  <div class="intro-sub" id="introSub">Word Match with Fun Boosters</div>
  <div class="intro-name" id="introName">RETRORAJA GAMES</div>
  <div class="big-msg" id="xMsg"></div>
</div>
<script src="three.min.js"></script>
<script src="core.js"></script>
<script src="main.js"></script>
</body>
</html>
