<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wordnoid Mini Games</title>
<!-- Update 1.1 mini games: Letter Wheel, Picture Hunt, Cracker Blast. Opened by MiniGames.kt with ?g=wheel|hunt|crack. -->
<style>
@font-face{font-family:"Lilita One";src:url(../fx/LilitaOne.ttf)}
:root{--gold:#ffc93c;--green:#2fbf4f;--green-dk:#17803a;--navy:#1b2140;--red:#ff4d5e;
  --display:"Lilita One","Arial Rounded MT Bold","Arial Black",sans-serif;--body:system-ui,sans-serif}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#1a1f5c;color:#fff;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:50%;top:50%;width:1000px;height:562.5px;margin:-281.25px 0 0 -500px;transform-origin:50% 50%;overflow:hidden;touch-action:none}
.screen{position:absolute;top:0;left:0;right:0;bottom:0}
[hidden]{display:none!important}
.bgcv{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;display:block}
.tiko{position:absolute;pointer-events:none}
.hud{position:absolute;top:22px;left:22px;right:22px;display:flex;align-items:center;gap:16px;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.xbtn{width:65px;height:46px;border-radius:14px;border:3.5px solid var(--gold);background:linear-gradient(#5677e8,#2c45b8);color:#fff;font-size:26px;font-family:var(--display);display:flex;align-items:center;justify-content:center;padding:0}
.title{font-family:var(--display);font-size:34px;color:#fff;text-shadow:0 3px 0 #1d2a80,0 0 10px #0006;white-space:nowrap}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:8px;background:linear-gradient(#3657c9,#24379a);border:3px solid var(--gold);border-radius:50px;padding:4px 16px 4px 5px;font-family:var(--display);font-size:26px;color:#fff}
.coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff6b0,#ffc93c 55%,#d18a00);box-shadow:inset 0 0 0 3px #b8730a;display:inline-block;flex:none}
.say{position:absolute;background:rgba(255,255,255,.97);color:var(--navy);border-radius:18px;padding:10px 18px 12px;font-weight:800;font-size:19px;line-height:1.25;box-shadow:0 10px 25px rgba(10,14,40,.3);max-width:300px;z-index:6;transition:opacity .3s,transform .3s cubic-bezier(.2,1.3,.4,1);transform-origin:left bottom;pointer-events:none}
.sayx{position:absolute;right:-10px;top:-12px;width:32px;height:32px;border-radius:50%;border:3px solid #fff;background:#e5533d;color:#fff;font-size:15px;font-weight:900;padding:0;line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.overx{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:#e5533d;color:#fff;font-size:18px;font-weight:900;padding:0}
.card{position:relative}
.say b{display:block;font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:.08em;color:#7b4dff;text-transform:uppercase}
.say.hide{opacity:0;transform:scale(.7)}
.say::after{content:"";position:absolute;left:25px;bottom:-12px;border:12px solid transparent;border-top-color:rgba(255,255,255,.97);border-bottom:0}
.toast{position:absolute;left:50%;top:13%;transform:translate(-50%,0) scale(.6);opacity:0;font-family:var(--display);font-size:36px;color:var(--gold);text-shadow:0 4px 0 #8a3b00,0 0 15px #0008;pointer-events:none;z-index:8;transition:transform .35s cubic-bezier(.3,1.7,.5,1),opacity .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.bad{color:#fff;text-shadow:0 4px 0 #a0102a,0 0 15px #0008}
.tile{position:relative;border-radius:12px;color:#fff;font-family:var(--display);display:flex;align-items:center;justify-content:center;text-shadow:0 2.5px 0 rgba(0,0,0,.3);
  box-shadow:inset 0 -5.5px 0 rgba(0,0,0,.25),inset 0 5px 3px rgba(255,255,255,.35),0 4px 7px rgba(0,0,0,.25)}
.over{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(14,18,60,.62);display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:linear-gradient(#3a66ee,#2340b5);border:5px solid var(--gold);border-radius:30px;padding:24px 34px;text-align:center;box-shadow:0 20px 50px #0008;display:flex;flex-direction:column;gap:14px;align-items:center;max-width:700px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:50px;color:var(--gold);text-shadow:0 5px 0 #8a3b00}
.card p{margin:0;font-size:21px;font-weight:800;color:#e6ecff}
.card ul{margin:0;padding:0;list-style:none;font-size:21px;font-weight:800;color:#fff;text-align:left;display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--display);font-size:28px;border:4px solid var(--gold);border-radius:18px;padding:10px 32px;color:#fff;background:linear-gradient(#45d86a,var(--green));box-shadow:0 6px 0 var(--green-dk)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-dk)}
.big.blue{background:linear-gradient(#5677e8,#2c45b8);box-shadow:0 6px 0 #142a80}
.row{display:flex;gap:16px}
.prize{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:40px;color:#fff}
.prize .coin{width:46px;height:46px}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
/* letter wheel */
.lw-bg{background:linear-gradient(#8a5cff,#ff9ec7)}
.grid{position:absolute;display:grid;gap:5px}
.cell{border-radius:10px;background:rgba(255,255,255,.55);box-shadow:inset 0 3px 5px rgba(60,30,120,.25);display:flex;align-items:center;justify-content:center}
.cell .tile{width:100%;height:100%;font-size:calc(var(--cs) * .62)}
.cell .tile.in{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.cell .hintl{font-family:var(--display);color:#7b4dff;font-size:calc(var(--cs) * .55);opacity:.7}
.wheel{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 40%,#c98a4b,#8a5426 70%,#6b3d17);box-shadow:inset 0 0 0 8px #6b3d17,inset 0 0 0 12px #e0a868,0 12px 25px rgba(40,10,60,.45);touch-action:none}
.wheel::before{content:"";position:absolute;top:14%;left:14%;right:14%;bottom:14%;border-radius:50%;background:repeating-radial-gradient(circle,#a36a33 0 6px,#b97b40 6px 13px);opacity:.55}
.wl{position:absolute;width:84px;height:84px;transform:translate(-50%,-50%);border-radius:18px;background:linear-gradient(#f9e2b5,#e6bd7a);color:#6b3d17;font-family:var(--display);font-size:48px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -7px 0 #b9833f,0 5px 8px rgba(0,0,0,.35);transition:transform .15s,background .15s}
.wheel.n7 .wl{width:72px;height:72px;font-size:42px}
.wl.on{background:linear-gradient(#ffe07a,#f2a516);color:#fff;text-shadow:0 3px 0 #9a5a00;transform:translate(-50%,-50%) scale(1.12)}
.wline{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:visible;width:100%;height:100%}
.cur{position:absolute;display:flex;gap:5px;justify-content:center;min-height:60px;align-items:center}
.cur .tile{width:54px;height:54px;font-size:34px}
.sidebtn{position:absolute;width:70px;height:70px;border-radius:50%;border:4px solid var(--gold);background:linear-gradient(#5677e8,#2c45b8);color:#fff;font-size:33px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #142a80;padding:0}
.sidebtn .n{position:absolute;bottom:-8px;right:-8px;background:var(--green);border:2.5px solid #fff;border-radius:10px;font-family:var(--display);font-size:15px;padding:0 6px}
.sidebtn .n.ad{background:#ff7a1a}
/* picture hunt */
.ph-panel{position:absolute;left:17%;right:2%;bottom:2.6%;height:29%;background:linear-gradient(#3a66ee,#2340b5);border:4.5px solid var(--gold);border-radius:24px;box-shadow:0 10px 20px #0007;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 90px 0 20px;z-index:4}
.slots{display:flex;gap:7px}
.slot{width:54px;height:54px;border-radius:11px;background:rgba(255,255,255,.18);border:3px dashed rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center}
.slot .tile{width:100%;height:100%;font-size:34px}
.letters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.letters .tile{width:58px;height:58px;font-size:36px;border:0;padding:0}
.letters .tile.used{visibility:hidden}
.letters .tile.wrong{background:var(--red)!important;animation:shake .4s}
.phpick{font-family:var(--display);font-size:26px;color:#fff;text-align:center}
.pencil{position:absolute;right:18px;top:50%;transform:translateY(-50%)}
.hearts{display:flex;gap:3px;font-size:26px;line-height:1}
.hearts span{transition:transform .3s,opacity .3s}
.hearts span.gone{opacity:.25;filter:grayscale(1);transform:scale(.8)}
/* cracker blast */
.cb-bg{background:radial-gradient(circle at 50% 70%,#3b1d6e,#140a33)}
.tbar{width:300px;height:26px;border-radius:20px;background:rgba(255,255,255,.18);border:3px solid var(--gold);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4d5e,#ffc93c,#45d86a);transform-origin:left;transition:transform .2s linear}
.spark{position:absolute;width:14px;height:14px;pointer-events:none;z-index:7;border-radius:50%}
.flycoin{position:absolute;z-index:8;pointer-events:none;width:30px;height:30px}
</style>
<script src="../fx/three.min.js"></script>
</head><body>
<div id="stage">
  <!-- ===== Letter Wheel ===== -->
  <section class="screen lw-bg" id="s-wheel" hidden>
    <div class="hud"><button class="xbtn back" aria-label="Leave">✕</button><span class="title">🎡 Letter Wheel</span><span class="sp"></span><span class="pill">⭐ Bonus <span id="lwbonus">0</span></span><span class="pill"><i class="coin"></i><span id="lwcoins">0</span></span></div>
    <div class="grid" id="lwgrid"></div>
    <div class="cur" id="lwcur"></div>
    <div class="wheel" id="lwwheel"><svg class="wline" id="lwline"></svg></div>
    <button class="sidebtn" id="lwshuf" aria-label="Shuffle letters">🔀</button>
    <button class="sidebtn" id="lwhint" aria-label="Pencil hint">✏️<span class="n" id="lwhn">3</span></button>
    <canvas class="tiko" id="tk-wheel" style="left:0;bottom:0;width:170px;height:220px"></canvas>
    <div class="say" id="say-wheel" style="left:120px;bottom:200px"></div>
    <div class="toast" id="lwtoast"></div>
  </section>
  <!-- ===== Picture Hunt ===== -->
  <section class="screen" id="s-hunt" hidden>
    <canvas class="bgcv" id="phcv"></canvas>
    <div class="hud"><button class="xbtn back" aria-label="Leave">✕</button><span class="title" style="color:#5a2c90;text-shadow:0 3px 0 #fff">🔍 Tiko's Picture Hunt</span><span class="sp"></span><span class="hearts" id="phhearts"></span><span class="pill"><i class="coin"></i><span id="phcoins">0</span></span></div>
    <div class="ph-panel">
      <div class="phpick" id="phpick">Tap a shadow to start</div>
      <div class="slots" id="phslots"></div>
      <div class="letters" id="phletters"></div>
      <button class="sidebtn pencil" id="phhint" aria-label="Pencil hint">✏️<span class="n" id="phhn">3</span></button>
    </div>
    <canvas class="tiko" id="tk-hunt" style="left:0;bottom:0;width:170px;height:220px"></canvas>
    <div class="say" id="say-hunt" style="left:110px;bottom:210px"></div>
    <div class="toast" id="phtoast"></div>
  </section>
  <!-- ===== Cracker Blast ===== -->
  <section class="screen cb-bg" id="s-crack" hidden>
    <canvas class="bgcv" id="cbcv"></canvas>
    <div class="hud"><button class="xbtn back" aria-label="Leave">✕</button><span class="title">🎆 Cracker Blast</span><span class="sp"></span><span class="pill">⏱ <span id="cbtime">30</span></span><div class="tbar"><i id="cbbar"></i></div><span class="pill">🧨 <span id="cbn">0</span></span><span class="pill"><i class="coin"></i><span id="cbcoins">0</span></span></div>
    <canvas class="tiko" id="tk-crack" style="left:0;bottom:0;width:170px;height:220px"></canvas>
    <div class="say" id="say-crack" style="left:110px;bottom:210px"></div>
    <div class="toast" id="cbtoast"></div>
  </section>
</div>
<script>
'use strict';
/* ---------- link to the app (MG bridge from MiniGames.kt). Works in a desktop browser too, for testing. ---------- */
const MG=window.MG||{config:()=>'{}',words:()=>'',sfx(){},ad(k){setTimeout(()=>adDone(k,true),300)},finish(c,s){console.log('finish',c,s)}};
const Q=new URLSearchParams(location.search);
let CFG={};try{CFG=JSON.parse(MG.config()||'{}')}catch(e){}
const GAME=CFG.game||Q.get('g')||'wheel', tier=Math.max(0,Math.min(4,+(CFG.tier??Q.get('tier')??0))), FREE_HINTS=+(CFG.hints??3);
const sfx=n=>{try{MG.sfx(n)}catch(e){}};
let finished=false;
function finish(coins){if(finished)return;finished=true;try{MG.finish(coins|0,coins|0)}catch(e){}}
const adWait={};
function askAd(kind,cb){adWait[kind]=cb;try{MG.ad(kind)}catch(e){cb(false)}}
window.adDone=(kind,ok)=>{const cb=adWait[kind];delete adWait[kind];if(cb)cb(!!ok)};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TILE_COLORS=['#c3d63a','#e8457a','#22aeb0','#8e3bc4','#f2861e','#2a8fe0','#e2492f','#4757c9','#ff6fa8','#39b86a'];
const rnd=n=>Math.floor(Math.random()*n);

/* ================= 3D Tiko (same model as the game) ================= */
const HAS3D=typeof THREE!=='undefined';
const geo={};
function rrShape(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);
  s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
function tileGeo(w,h,d,r,b){const g=new THREE.ExtrudeGeometry(rrShape(w-2*b,h-2*b,Math.max(.01,r-b)),{depth:d,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:4,curveSegments:8});g.translate(0,0,-d/2);return g}
function std(color,rough=.5,metal=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal})}
function makeTiko(){const g=new THREE.Group(),blue=std('#3fa9ff',.32),white=std('#ffffff',.2),black=std('#111111',.2),pink=std('#ff8fb8',.5),dark=std('#1f6fd0',.4);
  const body=new THREE.Mesh(geo.tikoB||(geo.tikoB=tileGeo(1,1,.46,.24,.09)),blue);body.position.y=.7;g.add(body);
  const shine=new THREE.Mesh(new THREE.PlaneGeometry(.78,.2),new THREE.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:.22}));shine.position.set(0,1.06,.33);g.add(shine);
  for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.15,20,16),white);e.position.set(s*.2,.82,.31);e.scale.set(1,1.15,.5);g.add(e);
    const p=new THREE.Mesh(new THREE.SphereGeometry(.075,16,12),black);p.position.set(s*.19,.8,.38);g.add(p);
    const hl=new THREE.Mesh(new THREE.SphereGeometry(.025,8,6),white);hl.position.set(s*.19+.025,.83,.45);g.add(hl);
    const ch=new THREE.Mesh(new THREE.SphereGeometry(.07,12,10),pink);ch.position.set(s*.34,.6,.32);ch.scale.z=.3;g.add(ch);
    const arm=new THREE.Group();arm.position.set(s*.55,.78,0);arm.rotation.z=s*.5;g.add(arm);
    const up=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,.32,10),blue);up.position.y=-.16;arm.add(up);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.11,14,10),white);hand.position.y=-.34;arm.add(hand);
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.22,10),dark);leg.position.set(s*.22,.15,0);g.add(leg);
    const f=new THREE.Mesh(new THREE.SphereGeometry(.15,16,12),dark);f.position.set(s*.22,.05,.06);f.scale.set(1,.55,1.35);g.add(f);
    g.userData[s<0?'armL':'armR']=arm}
  const smile=new THREE.Mesh(new THREE.TorusGeometry(.11,.025,8,20,Math.PI),black);smile.rotation.z=Math.PI;smile.position.set(0,.66,.33);g.add(smile);g.userData.smile=smile;
  const belt=new THREE.Mesh(new THREE.BoxGeometry(1.04,.09,.54),std('#7a4a2a',.6));belt.position.y=.34;g.add(belt);
  const buckle=new THREE.Mesh(new THREE.BoxGeometry(.14,.12,.04),std('#ffc93c',.3,.5));buckle.position.set(0,.34,.28);g.add(buckle);
  const hm=std('#ffb020',.35);const hat=new THREE.Mesh(new THREE.SphereGeometry(.4,24,12,0,Math.PI*2,0,Math.PI/2),hm);hat.position.y=1.16;g.add(hat);
  const brim=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.06,24),hm);brim.position.set(0,1.17,.08);g.add(brim);
  const ridge=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.8),hm);ridge.position.y=1.5;ridge.scale.y=.6;g.add(ridge);
  return g}
let TK=null;
function TikoView(id,turn=.45){const cv=document.getElementById(id);if(!HAS3D){cv.hidden=true;return}
  try{const r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});r.setPixelRatio(Math.min(2,devicePixelRatio||1));
    const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x8a7fd0,.95));const d=new THREE.DirectionalLight(0xffffff,.85);d.position.set(3,6,7);scene.add(d);
    const cam=new THREE.PerspectiveCamera(28,1,.1,50);cam.position.set(0,.95,5.6);cam.lookAt(0,.8,0);
    const t=makeTiko();t.rotation.y=turn;scene.add(t);TK={cv,r,scene,cam,t,mood:'idle',moodT:0,turn,w:0,h:0}}catch(e){cv.hidden=true}}
function mood(m,dur=1.4){if(!TK)return;TK.mood=m;TK.moodT=performance.now()/1000+dur}
function tikoFrame(now){const v=TK;if(!v)return;
  const w=v.cv.clientWidth,h=v.cv.clientHeight;if(w&&h&&(w!==v.w||h!==v.h)){v.w=w;v.h=h;v.r.setSize(w,h,false);v.cam.aspect=w/h;v.cam.updateProjectionMatrix()}
  let m=v.mood;if(m!=='idle'&&now>v.moodT)m=v.mood='idle';
  const t=v.t,aL=t.userData.armL,aR=t.userData.armR,k=RM?.2:1;
  t.position.y=0;t.rotation.x=0;t.rotation.z=0;t.rotation.y=v.turn+Math.sin(now*1.2)*.12*k;aL.rotation.z=-.5;aR.rotation.z=.5;t.userData.smile.rotation.z=Math.PI;t.userData.smile.position.y=.66;
  if(m==='idle'){t.position.y=Math.abs(Math.sin(now*2.2))*.05*k;aR.rotation.z=.5+Math.sin(now*2.2)*.12*k}
  else if(m==='wave'){aR.rotation.z=2.5+Math.sin(now*10)*.35;t.position.y=Math.abs(Math.sin(now*4))*.05}
  else if(m==='cheer'){const j=Math.abs(Math.sin(now*7));t.position.y=j*.35*k;aL.rotation.z=-2.6;aR.rotation.z=2.6;t.rotation.y=v.turn+Math.sin(now*7)*.3*k}
  else if(m==='sad'){t.rotation.x=.25;t.rotation.z=Math.sin(now*9)*.06*k;aL.rotation.z=-.15;aR.rotation.z=.15;t.userData.smile.rotation.z=0;t.userData.smile.position.y=.6}
  v.r.render(v.scene,v.cam)}

/* ================= shared helpers ================= */
const SCR=()=>$('#s-'+GAME);
const HELP=CFG.help!==false;
/* How-to-play lines: only on the first day of each game, and Tiko's bubble has a close button. */
function helpSay(text,ms){if(!HELP)return;say(text,ms);const e=$('#say-'+GAME);const x=document.createElement('button');x.className='sayx';x.setAttribute('aria-label','Close');x.textContent='✕';x.onclick=ev=>{ev.stopPropagation();e.classList.add('hide')};e.prepend(x)}
function say(text,ms){const e=$('#say-'+GAME);e.innerHTML='<b>Tiko</b>'+text;e.classList.remove('hide');clearTimeout(e._t);if(ms)e._t=setTimeout(()=>e.classList.add('hide'),ms)}
function hush(){$('#say-'+GAME).classList.add('hide')}
function toast(id,text,bad){const e=$(id);e.textContent=text;e.classList.toggle('bad',!!bad);e.classList.remove('show');void e.offsetWidth;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1100)}
function tileEl(ch,i,tag='div'){const e=document.createElement(tag);e.className='tile';e.textContent=ch;e.style.background=`linear-gradient(${shade(TILE_COLORS[i%10],18)},${TILE_COLORS[i%10]})`;return e}

/* ================= words ================= */
let WORDS=[];
function loadWords(){let txt='';try{txt=MG.words()||''}catch(e){}
  if(!txt){try{const x=new XMLHttpRequest();x.open('GET','../play_words.txt',false);x.send();txt=x.responseText}catch(e){}}
  WORDS=txt.split(/\s+/).filter(w=>/^[a-z]{3,8}$/.test(w)).map(w=>w.toUpperCase())}

/* ================= LETTER WHEEL ================= */
const lw={};
function counts(w){const c=new Array(26).fill(0);for(const ch of w)c[ch.charCodeAt(0)-65]++;return c}
function fits(c,base){for(let i=0;i<26;i++)if(c[i]>base[i])return false;return true}
// Builds a little crossword from one base word: base across, other words cross it (no touching side by side).
function lwLayout(base,subs,want){const cells=new Map(),words=[];
  const put=(w,r,c,d)=>{for(let i=0;i<w.length;i++){const k=(d==='v'?r+i:r)+','+(d==='h'?c+i:c),e=cells.get(k)||{ch:w[i],d:''};e.d+=d;cells.set(k,e)}words.push([w,r,c,d])};
  const at=(r,c)=>cells.get(r+','+c);
  const box=()=>{let a=1e9,b=-1e9,c=1e9,d=-1e9;for(const k of cells.keys()){const [r,cc]=k.split(',').map(Number);a=Math.min(a,r);b=Math.max(b,r);c=Math.min(c,cc);d=Math.max(d,cc)}return [a,b,c,d]};
  function ok(w,r,c,d){const dr=d==='v'?1:0,dc=d==='h'?1:0;let cross=0;
    if(at(r-dr,c-dc)||at(r+dr*w.length,c+dc*w.length))return false;
    for(let i=0;i<w.length;i++){const rr=r+dr*i,cc=c+dc*i,e=at(rr,cc);
      if(e){if(e.ch!==w[i]||e.d.includes(d))return false;cross++}
      else if(at(rr+dc,cc+dr)||at(rr-dc,cc-dr))return false}
    if(!cross||cross===w.length)return false;
    // keep it small enough to show big letters
    let [a,b,x,y]=box();a=Math.min(a,r);x=Math.min(x,c);b=Math.max(b,r+dr*(w.length-1));y=Math.max(y,c+dc*(w.length-1));
    return b-a+1<=7&&y-x+1<=9}
  put(base,0,0,'h');
  for(const w of subs){if(words.length>=want)break;const opts=[];
    for(const [k,e] of cells){const [r,c]=k.split(',').map(Number);
      for(let i=0;i<w.length;i++)if(w[i]===e.ch)for(const d of['h','v']){const r0=d==='v'?r-i:r,c0=d==='h'?c-i:c;if(ok(w,r0,c0,d))opts.push([r0,c0,d])}}
    if(opts.length){const o=opts[rnd(opts.length)];put(w,o[0],o[1],o[2])}}
  const [a,,x]=box();return words.map(([w,r,c,d])=>[w,r-a,c-x,d])}
function lwMake(){const L=[4,5,6,6,7][tier],want=[3,4,5,6,6][tier];
  const pool=WORDS.filter(w=>w.length===L);let best=null;
  for(let t=0;t<300&&pool.length;t++){const base=pool[rnd(pool.length)],bc=counts(base);
    const subs=WORDS.filter(w=>w!==base&&w.length<=L&&fits(counts(w),bc));
    if(subs.length<want-1)continue;
    // longer words first, mixed a little so each puzzle is different
    const order=shuffle(subs.slice()).sort((p,q)=>q.length-p.length+(Math.random()-.5)*1.5);
    const words=lwLayout(base,order,want);
    if(!best||words.length>best.words.length)best={letters:base,words,bonus:subs.filter(w=>!words.some(x=>x[0]===w))};
    if(words.length>=want)break}
  return best||{letters:'SEAT',words:[['SEAT',0,0,'h'],['EAT',0,1,'v'],['TEA',0,3,'v']],bonus:['EAST','EATS','ATE','SAT','SEA','SET']}}
function lwStart(){const P=lwMake();Object.assign(lw,{P,found:new Set(),bonus:new Set(),coins:0,hints:FREE_HINTS,order:shuffle([...P.letters]),path:[],done:false});
  curCoins=()=>lw.coins;hintBadge($('#lwhn'),lw.hints);
  let R=0,C=0;lw.cells={};P.words.forEach(([w,r,c,d],wi)=>{[...w].forEach((ch,i)=>{const rr=d==='v'?r+i:r,cc=d==='h'?c+i:c;R=Math.max(R,rr+1);C=Math.max(C,cc+1);const k=rr+','+cc;(lw.cells[k]||(lw.cells[k]={ch,words:[]})).words.push(wi)})});
  const g=$('#lwgrid');g.innerHTML='';const cs=Math.min(7.2,46/C,40/R);g.style.setProperty('--cs',cs*10+'px');g.style.gridTemplateColumns=`repeat(${C},${cs*10}px)`;g.style.gridTemplateRows=`repeat(${R},${cs*10}px)`;
  const gw=C*cs+(C-1)*.5,gh=R*cs+(R-1)*.5;lw.gx=36-gw/2;lw.gy=31-gh/2;g.style.left=lw.gx*10+'px';g.style.top=lw.gy*10+'px';
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const k=r+','+c,d=document.createElement('div');if(lw.cells[k]){d.className='cell';lw.cells[k].el=d}g.appendChild(d)}
  lw.cs=cs;lwWheel();lwCur();helpSay(`Swipe across the ${P.letters.length} letters to make words and fill the puzzle. Extra real words = bonus coins!`,6000)}
function lwWheel(){const w=$('#lwwheel'),D=31,n=lw.order.length;w.style.width=w.style.height=D*10+'px';w.style.left=(76-D/2)*10+'px';w.style.top=(34-D/2)*10+'px';w.classList.toggle('n7',n>=7);
  $$('#lwwheel .wl').forEach(e=>e.remove());const rad=n<=4?28:n===5?31:n===6?33:35;
  lw.order.forEach((ch,i)=>{const a=i/n*Math.PI*2-Math.PI/2,e=document.createElement('div');e.className='wl';e.textContent=ch;e.style.left=(50+Math.cos(a)*rad)+'%';e.style.top=(50+Math.sin(a)*rad)+'%';e.dataset.i=i;w.appendChild(e)});
  $('#lwshuf').style.left=(76-D/2-2)*10+'px';$('#lwshuf').style.top=(34+D/2-6)*10+'px';$('#lwhint').style.left=(76+D/2-5)*10+'px';$('#lwhint').style.top=(34+D/2-6)*10+'px';
  const cur=$('#lwcur');cur.style.left='560px';cur.style.right='0';cur.style.top='90px'}
function lwCur(){const c=$('#lwcur');c.innerHTML='';lw.path.forEach((i,k)=>c.appendChild(tileEl(lw.order[i],k+3)));
  $$('#lwwheel .wl').forEach(e=>e.classList.toggle('on',lw.path.includes(+e.dataset.i)));
  const svg=$('#lwline'),pts=lw.path.map(i=>{const e=$(`#lwwheel .wl[data-i="${i}"]`);return [parseFloat(e.style.left),parseFloat(e.style.top)]});
  svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');
  let d=pts.map(p=>p.join(',')).join(' ');if(lw.drag&&pts.length)d+=' '+lw.drag.join(',');
  svg.innerHTML=pts.length?`<polyline points="${d}" fill="none" stroke="#fff3a6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`:''}
function lwHit(e){const w=$('#lwwheel').getBoundingClientRect(),px=(e.clientX-w.left)/w.width*100,py=(e.clientY-w.top)/w.height*100;lw.drag=[px,py];
  const r=lw.order.length>=7?12:15;for(const el of $$('#lwwheel .wl')){const dx=parseFloat(el.style.left)-px,dy=parseFloat(el.style.top)-py;if(dx*dx+dy*dy<r*r)return +el.dataset.i}return -1}
function lwBind(){const wheelEl=$('#lwwheel');
  wheelEl.addEventListener('pointerdown',e=>{if(lw.done)return;const i=lwHit(e);if(i<0)return;wheelEl.setPointerCapture(e.pointerId);lw.path=[i];lw.down=true;sfx('note0');hush();lwCur()});
  wheelEl.addEventListener('pointermove',e=>{if(!lw.down)return;const i=lwHit(e);if(i>=0){const p=lw.path;if(p.length>1&&p[p.length-2]===i){p.pop();sfx('tick')}else if(!p.includes(i)){p.push(i);sfx('note'+Math.min(p.length-1,7))}}lwCur()});
  const lwUp=()=>{if(!lw.down)return;lw.down=false;lw.drag=null;const word=lw.path.map(i=>lw.order[i]).join('');lw.path=[];lwCur();if(word.length>=3)lwCheck(word)};
  wheelEl.addEventListener('pointerup',lwUp);wheelEl.addEventListener('pointercancel',lwUp);
  $('#lwshuf').onclick=()=>{if(lw.done)return;sfx('shuffle');lw.order=shuffle(lw.order);lwWheel();lwCur()};
  $('#lwhint').onclick=()=>{if(lw.done)return;
    if(lw.hints<=0){askAd('hint',ok=>{if(ok){lw.hints++;hintBadge($('#lwhn'),lw.hints);lwHint()}else toast('#lwtoast','No video right now',true)});return}
    lwHint()}}
function lwHint(){for(const k in lw.cells){const cell=lw.cells[k];if(!cell.filled&&!cell.hinted){cell.hinted=true;cell.el.innerHTML=`<span class="hintl">${cell.ch}</span>`;lw.hints--;hintBadge($('#lwhn'),lw.hints);sfx('sparkle');mood('wave',.8);return}}}
function lwCheck(word){const P=lw.P,wi=P.words.findIndex(w=>w[0]===word);
  if(wi>=0){if(lw.found.has(wi)){toast('#lwtoast','Already found',true);sfx('nope');return}
    lw.found.add(wi);lwFill(wi,true);lw.coins+=5;$('#lwcoins').textContent=lw.coins;toast('#lwtoast',word+'!  +5');mood('cheer',1.2);sfx('ding');
    const [w,r,c,d]=P.words[wi];const step=lw.cs+.5,cx=lw.gx+(c+(d==='h'?w.length/2:.5))*step,cy=(lw.gy+(r+(d==='v'?w.length/2:.5))*step)/56.25*100;
    sparkles(cx,cy,14);flyCoins(cx,cy,$('#lwcoins'),4);
    // a word can finish others by crossing letters
    P.words.forEach((x,j)=>{if(!lw.found.has(j)&&lwFull(j))lw.found.add(j)});
    if(lw.found.size===P.words.length)setTimeout(lwWin,900);return}
  if(P.bonus.includes(word)){if(lw.bonus.has(word)){toast('#lwtoast','Bonus already found',true);return}
    lw.bonus.add(word);const add=lw.bonus.size<=10?2:0;lw.coins+=add;$('#lwcoins').textContent=lw.coins;$('#lwbonus').textContent=lw.bonus.size;toast('#lwtoast','Bonus word '+word+(add?'!  +2':'!'));mood('wave',1);sfx('coin');
    if(lw.bonus.size===1)helpSay('Bonus word! It is not in the puzzle, but it is a real word, so you get extra coins.',4000);return}
  toast('#lwtoast','Not a word',true);sfx('nope');$('#lwcur').classList.remove('shake');void $('#lwcur').offsetWidth;$('#lwcur').classList.add('shake');mood('sad',1)}
function lwFull(wi){const [w,r,c,d]=lw.P.words[wi];return [...w].every((ch,i)=>lw.cells[(d==='v'?r+i:r)+','+(d==='h'?c+i:c)].filled)}
function lwFill(wi,anim){const [w,r,c,d]=lw.P.words[wi];[...w].forEach((ch,i)=>{const k=(d==='v'?r+i:r)+','+(d==='h'?c+i:c),cell=lw.cells[k];if(cell.filled)return;cell.filled=true;
  const t=tileEl(ch,wi*2+i);if(anim){t.classList.add('in');t.style.animationDelay=(i*.07)+'s'}cell.el.innerHTML='';cell.el.appendChild(t)})}
function lwWin(){if(lw.done)return;lw.done=true;const bonus=10+tier*5;lw.coins+=bonus;$('#lwcoins').textContent=lw.coins;
  endCard('PUZZLE COMPLETE!',`${lw.P.words.length} words · ${lw.bonus.size} bonus words · finish bonus +${bonus}`,lw.coins)}

function cbExpand(set,colour){const q=[...set.values()].map(k=>k.split(',').map(Number));
  while(q.length){const [r,c]=q.shift(),e=cb.b[r][c];if(isPlain(e.k)||e.fired)continue;e.fired=true;const add=[];
    if(e.k===ROCKET){for(let i=0;i<N;i++){add.push([r,i]);add.push([i,c])}sfx('whoosh')}
    else if(e.k===POT){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(cbAt(r+dr,c+dc))add.push([r+dr,c+dc]);sfx('bang')}
    else if(e.k===CHAKRA){let k=colour;if(k==null){const cnt={};cb.b.flat().forEach(x=>{if(isPlain(x.k))cnt[x.k]=(cnt[x.k]||0)+1});k=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]}
      for(let rr=0;rr<N;rr++)for(let cc=0;cc<N;cc++)if(cb.b[rr][cc].k===k)add.push([rr,cc]);sfx('crackle')}
    for(const p of add){const key=p.join(',');if(!set.has(key)){set.add(key);if(!isPlain(cb.b[p[0]][p[1]].k))q.push(p)}}}
  return set}
async function cbBlast(cells,colour){cb.busy=true;const set=new Set(cells.map(p=>p.join(',')));cbExpand(set,colour);await cbClear(set,[]);await cbResolve(null);cb.busy=false}
async function cbResolve(pivot){let chain=0;
  while(true){const runs=cbRuns();if(!runs.length)break;chain++;const set=new Set(),make=[];
    const inH=new Map(),inV=new Map();runs.forEach(run=>run.cells.forEach(p=>{set.add(p.join(','));(run.d==='h'?inH:inV).set(p.join(','),run)}));
    for(const run of runs){const n=run.cells.length;if(n<4)continue;
      const at=pivot&&run.cells.some(p=>p[0]===pivot[0]&&p[1]===pivot[1])?pivot:run.cells[n>>1];make.push([at,n>=5?CHAKRA:ROCKET])}
    for(const [k] of inH)if(inV.has(k)&&!make.length)make.push([k.split(',').map(Number),POT]);
    cbExpand(set,null);
    if(chain>1)toast('#cbtoast',['','','Nice!','Great!','Amazing!','WOW!'][Math.min(chain,5)]);
    await cbClear(set,make);pivot=null}
  if(!cbHasMove()){toast('#cbtoast','Mixing the crackers');sfx('shuffle');cbFill()}}
async function cbClear(set,make){const cells=[...set].map(k=>k.split(',').map(Number));
  for(const [r,c] of cells){const e=cb.b[r][c];e.gone=true;cbBurst(r,c,e.k)}
  sfx(cells.length>=6?'burst':'pop');if(cells.length>=8)mood('cheer',1);
  const before=Math.floor(cb.cleared/3);cb.cleared+=cells.length;const after=Math.min(MAX_COINS,Math.floor(cb.cleared/3));
  if(after>before){cb.coins=after;$('#cbcoins').textContent=cb.coins;if(after%5===0)sfx('coin')}
  $('#cbn').textContent=cb.cleared;
  await wait(170);
  for(const [at,k] of make){const e=cb.b[at[0]][at[1]];e.gone=false;e.fired=false;e.k=k;e.sc=1.4;sfx('star')}
  // fall + refill: special crackers drop in now and then (a bit more often at higher levels)
  const chance=[.02,.03,.04,.05,.06][tier];
  for(let c=0;c<N;c++){const col=[];for(let r=N-1;r>=0;r--)if(!cb.b[r][c].gone)col.push([r,cb.b[r][c]]);let w=N-1;
    for(const [from,e] of col){e.dy=(e.dy||0)+(from-w);cb.b[w][c]=e;w--}
    const m=w+1;for(;w>=0;w--){const e=cbNew();if(Math.random()<chance)e.k=[ROCKET,POT,CHAKRA][rnd(3)];e.dy=-m;cb.b[w][c]=e}}
  sfx('drop');await wait(230)}
function cbBurst(r,c,k){const x=cb.ox+(c+.5)*cb.cell,y=cb.oy+(r+.5)*cb.cell;const n=RM?3:9;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*5)*cb.cell/40;cb.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,col:SPARK[k]||'#fff'})}}
function cbFrame(now){if(!cb.ctx)return;const x=cb.ctx,cs=cb.cell;
  if(cb.running&&!cb.over){const dt=Math.min(.1,now-cb.last);cb.last=now;cb.t-=dt;const left=Math.max(0,Math.ceil(cb.t));
    if($('#cbtime').textContent!=left){$('#cbtime').textContent=left;if(left<=5&&left>0)sfx('tick')}
    $('#cbbar').style.transform=`scaleX(${Math.max(0,cb.t/TIME)})`;
    if(cb.t<=0&&!cb.busy){cb.over=true;cb.running=false;setTimeout(cbEnd,500)}}
  x.clearRect(0,0,cb.W,cb.H);
  // night sky stars
  x.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<40;i++){const sx=(i*263)%cb.W,sy=(i*151)%(cb.H*.9),tw=.5+.5*Math.sin(now*2+i);x.globalAlpha=.25+.5*tw;x.fillRect(sx,sy,2,2)}x.globalAlpha=1;
  // board
  x.fillStyle='rgba(20,10,60,.55)';rrect(x,cb.ox-cs*.15,cb.oy-cs*.15,cs*(N+.3),cs*(N+.3),cs*.3);x.fill();x.strokeStyle='#ffc93c';x.lineWidth=cs*.06;x.stroke();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){x.fillStyle=(r+c)%2?'rgba(255,255,255,.06)':'rgba(255,255,255,.12)';x.fillRect(cb.ox+c*cs,cb.oy+r*cs,cs,cs)}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const e=cb.b[r][c];if(!e||e.gone)continue;
    if(e.dy){e.dy=e.dy<0?Math.min(0,e.dy+.22):Math.max(0,e.dy-.22)}
    if(e.sc!==1)e.sc=Math.max(1,e.sc-.03);
    let px=c,py=r+e.dy;if(e.sw!=null){px+=e.sx*e.sw;py+=e.sy*e.sw}
    const im=IMG[e.k],pulse=isPlain(e.k)?1:1+Math.sin(now*6)*.05,s=cs*.92*e.sc*pulse,cx=cb.ox+(px+.5)*cs,cy=cb.oy+(py+.5)*cs;
    if(!isPlain(e.k)){x.save();x.shadowColor='#fff36a';x.shadowBlur=cs*.4;}
    if(im.complete&&im.naturalWidth)x.drawImage(im,cx-s/2,cy-s/2,s,s);else{x.fillStyle=SPARK[e.k];x.beginPath();x.arc(cx,cy,s*.4,0,7);x.fill()}
    if(!isPlain(e.k))x.restore()}
  // sparks
  cb.parts=cb.parts.filter(p=>(p.life-=.025)>0);for(const p of cb.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;x.globalAlpha=p.life;x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,cs*.07*(.5+p.life),0,7);x.fill()}x.globalAlpha=1}
function cbEnd(){const c=cb.coins;endCard("TIME'S UP!",`${cb.cleared} crackers blasted · every 3 = 1 coin`,c)}

/* ================= start ================= */
let raf=0;
function frame(){const now=performance.now()/1000;tikoFrame(now);if(GAME==='crack')cbFrame(now);
  if(GAME==='hunt'&&ph.sel>=0&&!RM&&!(raf++%3))phPaint(now);requestAnimationFrame(frame)}
function fit(){const W=innerWidth||document.documentElement.clientWidth,H=innerHeight||document.documentElement.clientHeight;if(!W||!H)return;const k=Math.min(W/1000,H/562.5);$('#stage').style.transform='scale('+k+')'}
addEventListener('resize',fit);fit();
function boot(){fit();$('#s-'+GAME).hidden=false;document.body.style.background={wheel:'#c47ddf',hunt:'#ffd3ec',crack:'#140a33'}[GAME]||'';TikoView('tk-'+GAME);
  if(GAME==='wheel'){loadWords();lwBind();lwStart()}
  else if(GAME==='hunt'){phBind();phStart();addEventListener('resize',()=>{ph.ctx=null;phPaint()})}
  else{cbBind();cbStart()}
  mood('wave',1.5);requestAnimationFrame(frame)}
if(document.fonts&&document.fonts.load)document.fonts.load('20px "Lilita One"').finally(boot);else boot();
</script>
